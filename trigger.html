<!DOCTYPE html>
<html>

<head>

    <title>Trigger Logs</title>

    <style>

        body{
            font-family: Arial;
            background: #f2f2f2;
            text-align: center;
        }

        .container{
            width: 80%;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        table{
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td{
            border: 1px solid #ddd;
            padding: 12px;
        }

        th{
            background: #f5f5f5;
        }

        .btn{
            margin-top: 20px;
            display: inline-block;
            padding: 15px 30px;
            background: white;
            border: 1px solid #ccc;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Vivekananda Institute of Technology</h1>

    <h2>Trigger Logs</h2>

    <table>

        <tr>
            <th>SI.NO</th>
            <th>NAME</th>
            <th>USN</th>
            <th>ITEM</th>
        </tr>

        <tbody id="logBody"></tbody>

    </table>

    <div class="btn" onclick="location.href='/home.html'">
        BACK TO HOME
    </div>

</div>

<script>

fetch("/logs")

.then(res => res.json())

.then(data => {

    let output = "";

    data.forEach(log => {

        output += `
        <tr>

            <td>${log.log_id}</td>

            <td>${log.student_name}</td>

            <td>${log.usn}</td>

            <td>${log.item_name} added</td>

        </tr>
        `;
    });

    document.getElementById("logBody").innerHTML = output;

});

</script>

</body>

</html>
