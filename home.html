<!DOCTYPE html>
<html>
<head>
    <title>Home</title>

    <style>

        body{
            font-family:Arial;
            text-align:center;
            background:#f2f2f2;
        }

        .title{
            font-size:28px;
            font-weight:bold;
            margin-top:20px;
        }

        .subtitle{
            font-size:24px;
            font-weight:bold;
            margin-bottom:40px;
        }

        .container{
            display:flex;
            justify-content:center;
            gap:40px;
            flex-wrap:wrap;
        }

        .box{
            background:white;
            padding:25px 40px;
            border-radius:10px;
            font-weight:bold;
            cursor:pointer;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }

        .box:hover{
            background:#f9f9f9;
        }

        #menu{
            display:none;
            margin-top:50px;
        }

    </style>

</head>

<body>

<br><br>

<div class="title">
    VIVEKANANDA INSTITUTE OF TECHNOLOGY
</div>

<br><br>

<div class="subtitle">
    LOST & FOUND
</div>

<div class="container">

    <div class="box" onclick="showMenu()">
        STUDENT
    </div>

    <div class="box" onclick="showMenu()">
        FACULTY
    </div>

</div>

<div id="menu">

    <div class="container" style="margin-top:40px;">

        <div class="box" onclick="location.href='/index.html'">
            ADD ITEM
        </div>

        <div class="box" onclick="location.href='/view.html'">
            VIEW ITEMS
        </div>

        <div class="box" onclick="location.href='/trigger.html'">
            TRIGGER LOGS
        </div>

    </div>

</div>

<script>

function showMenu(){

    document.getElementById("menu").style.display = "block";

}

</script>

</body>
</html>
