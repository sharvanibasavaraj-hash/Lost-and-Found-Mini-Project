<!DOCTYPE html>
<html>
<head>
    <title>Add Item</title>
    <style>
       
    </style>
</head>

<body style="font-family:Arial; text-align:center; background:#f2f2f2;">

<div style="background:white; width:400px; margin:40px auto; padding:20px; border-radius:10px;">

<h2>VIVEKANANDA INSTITUTE OF TECHNOLOGY</h2>
<h4>LOST & FOUND</h4>
<h5>NOTE: Teaching and Non-teaching staff including management can enter name and item details(if necessay, can enter other details too).</h5>

<form action="/add" method="POST">

<input name="student_name" placeholder="Name"><br><br>
<input name="usn" placeholder="USN"><br><br>
<input name="department" placeholder="Department"><br><br>
<input name="student_year" placeholder="Year"><br><br>

<input name="item_name" placeholder="Item Name"><br><br>
<input name="description" placeholder="Description"><br><br>

<input name="phone" placeholder="Phone"><br><br>
<input name="email" placeholder="Email"><br><br>

<select name="type" id="typeSelect" onchange="toggleDate()">
    <option value="lost">Lost</option>
    <option value="found">Found</option>
</select>

<br><br>

<!-- LOST DATE -->
<div id="lostBox">
    <input type="date" name="lost_date">
</div>

<!-- FOUND DATE -->
<div id="foundBox" style="display:none;">
    <input type="date" name="found_date">
</div>

<br>

<input name="location" placeholder="Location"><br><br>

<button type="submit">SUBMIT</button>

</form>

<br>
<a href="/home.html">BACK</a>

</div>

<script>
function toggleDate() {
    let type = document.getElementById("typeSelect").value;

    document.getElementById("lostBox").style.display =
        (type === "lost") ? "block" : "none";

    document.getElementById("foundBox").style.display =
        (type === "found") ? "block" : "none";
}

toggleDate();
</script>

</body>
</html>
